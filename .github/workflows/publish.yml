name: Publish

on:
  push:
    branches:
      - develop
      - staging
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - ".github/workflows/publish.yml"
  release:
    types:
      - published

permissions:
  contents: read
  packages: write
  # actions: read  # für den auskommentierten Watchtower-Job confirm

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "release" ]; then
            case "$RELEASE_TAG" in
              v*) ;;
              *)
                echo "Release tag ${RELEASE_TAG} does not match v*."
                exit 0
                ;;
            esac
            tags="$RELEASE_TAG"
            if [ "$RELEASE_PRERELEASE" != "true" ]; then
              tags="$tags latest"
            fi
          elif [ "$REF_NAME" = "develop" ]; then
            tags="develop"
          elif [ "$REF_NAME" = "staging" ]; then
            tags="staging"
          else
            echo "Nothing to publish for ${REF_NAME}."
            exit 0
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          for spec in "seezeit-portal-frontend frontend" "seezeit-portal-backend backend"; do
            name=${spec%% *}
            context=${spec##* }
            image="ghcr.io/${owner}/${name}"
            tag_args=()
            for tag in $tags; do
              tag_args+=(-t "${image}:${tag}")
            done
            docker build \
              --label "org.opencontainers.image.source=${source}" \
              "${tag_args[@]}" \
              "$context"
            for tag in $tags; do
              docker push "${image}:${tag}"
            done
          done

