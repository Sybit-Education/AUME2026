name: ${SEEZEIT_PROJECT:-seezeit}

services:
  frontend:
    image: ghcr.io/sybit-education/seezeit-portal-frontend:develop
    pull_policy: always
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    labels:
      - com.centurylinklabs.watchtower.enable=true

  backend:
    image: ghcr.io/sybit-education/seezeit-portal-backend:develop
    pull_policy: always
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ../devdata:/devdata
    # Neues Image, neue Sample-Daten: der Container startet mit leerer H2-Datei.
    # Der lokale Start mit mvnw lässt devdata/db stehen.
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -f /devdata/db/aume.mv.db /devdata/db/aume.trace.db /devdata/db/aume.lock.db
        exec java -jar /app/app.jar
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:h2:file:/devdata/db/aume;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      AUME_STORAGE_LOCATION: /devdata/uploads
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: nickfedor/watchtower:1.24.2
    restart: unless-stopped
    env_file:
      - path: ./develop-vm.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchtower-notify.tmpl:/watchtower-notify.tmpl:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      WATCHTOWER_NOTIFICATION_TEMPLATE_FILE: /watchtower-notify.tmpl
