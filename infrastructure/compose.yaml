services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "80:80"

  backend:
    build:
      context: ../backend
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
