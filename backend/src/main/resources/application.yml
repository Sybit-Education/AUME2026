server:
  port: 8080

KEYCLOAK_URL: http://localhost:8081
KEYCLOAK_REALM: seezeit
KEYCLOAK_CLIENT_ID: seezeit-frontend
KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/seezeit
KEYCLOAK_JWK_SET_URI: http://localhost:8081/realms/seezeit/protocol/openid-connect/certs
KEYCLOAK_AUDIENCE: seezeit-api

spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: jdbc:h2:mem:aume;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    web:
      pageable:
        max-page-size: 100

# Arbeitsverzeichnis ist backend/, deshalb liegt devdata/ im Repository-Root.
aume:
  storage:
    location: ${user.dir}/../devdata/uploads

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
