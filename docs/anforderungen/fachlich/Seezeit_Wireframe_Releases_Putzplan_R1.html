/* Ergänzungen aus dem Feedback – bestehende Gestaltung bleibt erhalten */
.consequence{background:#fff0ee;border:2px solid #ba3f37;border-radius:12px;padding:12px 13px;color:#842f2a;margin:10px 0}

</style></head><body><div id="app"></div><div id="ov"></div><div id="tt"></div><script>const $=i=>document.getElementById(i);

SBV.ana=()=>{const tb=S.tab.ana,r=recF(),er=r.filter(x=>x.typ==='Erst');let body='';const fl=`<div class="flt"><label class="lbl">Anlage</label>${fsel('sel.anaAnl',['alle',...D.anl.map(a=>a.id)],S.sel.anaAnl)}<label class="lbl">Zeitraum</label>${fsel('sel.anaZeit',['alle',...SAIS],S.sel.anaZeit)}</div>`;if(tb==='quote'){const b=er.filter(x=>x.erg==='Bestanden').length,n=er.filter(x=>x.erg!=='Bestanden').length;body=fl+`<div class="g4" style="margin-bottom:12px"><div class="kpi"><span class="n">${pct(b,er.length)}</span><span class="l">Erstbestehensquote</span></div><div class="kpi"><span class="n">${pct(n,er.length)}</span><span class="l">Nachkontrollquote</span></div><div class="kpi"><span class="n">${er.length}</span><span class="l">Erstkontrollen</span></div><div class="kpi"><span class="n">${r.length-er.length}</span><span class="l">Nachkontrollen</span></div></div>`+seeQuotaChart(r)+card('Quoten nach Anlage und Zeitraum',tbl(['Anlage','Zeitraum','Erstkontrollen','Bestanden im ersten Durchgang','Mit Nachkontrolle'],D.anl.flatMap(a=>SAIS.map(s=>{const x=recs().filter(q=>q.anl===a.id&&sai(q.datum)===s&&q.typ==='Erst');return [a.id,s,x.length,pct(x.filter(q=>q.erg==='Bestanden').length,x.length),pct(x.filter(q=>q.erg!=='Bestanden').length,x.length)]}))))+`<p class="xs mut">Erstbestehensquote: Anteil der Erstkontrollen mit Ergebnis Bestanden. Nachkontrollquote: Anteil der Erstkontrollen mit anschließender Nachkontrolle.</p>`}else if(tb==='maengel'){const th=S.sel.schwelle,rows=CRIT.map(c=>({c,n:D.anl.map(a=>r.filter(x=>x.anl===a.id&&x.m.includes(c.id)).length)}));const fl2=rows.filter(x=>x.n.some(v=>v>=th));body=fl+`<div class="flt"><label class="lbl">Häufung ab</label>${fsel('sel.schwelle',[2,3,4,5,6,8],th)}<span class="xs mut">Mängeln je Kriterium und Anlage</span></div>`+seeDefectCharts(r)+card('Mängel je Kriterium und Anlage',tbl(['Kriterium',...D.anl.map(a=>a.id)],rows.map(x=>[h(x.c.name),...x.n.map(v=>`<span class="chip ${v>=th?'bad':v>0?'wr':''}">${v}</span>` ter(x=>x.wg===w.id&&x.m.length).sort((a,b)=>b.datum.localeCompare(a.datum));if(l.length>=2){const c=l[0].m.find(i=>l[1].m.includes(i));if(c)sug.push({id:'w'+w.id+c,wg:w.id,t:'Wiederkehrender Mangel',x:'WG '+w.id+': „'+crit(c).name+'“ wurde bei den letzten zwei Kontrollen bemängelt. Prüfe, ob eine Ursache am Gebäude möglich ist, oder führe ein Gespräch.',a:'Verlauf ansehen',f:'wgd',v:w.id})}});const open=sug.filter(s=>!S.anaDismiss[s.id]);body=note('Diese Vorschläge entstehen automatisch aus den dokumentierten Mängeln. Du prüfst sie und entscheidest selbst. Du kannst sie ignorieren.')+(open.length?open.map(s=>card(s.t+' · WG '+s.wg,`<p>${h(s.x)}</p><div class="acts">${btn(s.a,s.f,s.v,'sm')}${btn('Ignorieren','dism',s.id,'sm gh')}</div>`)).join(''):card('',empty('✅','Keine Vorschläge','Im Moment gibt es keinen Handlungsbedarf.')))}if(['verlauf','anerk','vorschlag'].includes(tb))body=fl+body;return pt('Auswertung')+tabs('ana',[['quote','Quoten'],['maengel','Mängel und Gebäude'],['verlauf','Verlauf'],['anerk','Anerkennung'],['vorschlag','Vorschläge']])+body};

OBV.damage=()=>{const l=D.schaden.slice();return pt('Schadensmeldungen')+tbl(['Datum','WG','Meldung','Status',''],l.map(s=>[dmy(s.am),`<b>${s.wg}</b>`,h(s.text||s.titel||''),chip(s.status,s.status==='erledigt'?'ok':'wr'),s.status==='erledigt'?'':btn(s.status==='offen'?'In Bearbeitung':'Erledigt','obsch',s.id,'sm')]),{empty:'Keine Schadensmeldungen'})+`<div class="acts">${btn('+ Schaden erfassen','obschadd','','sm sec')}</div>`};
A.obsch=v=>{const s=D.schaden.find(x=>x.id===v);s.status=s.status==='offen'?'in Bearbeitung':'erledigt';toast('Status aktualisiert.');R()};
A.obschadd=()=>formM('Schaden erfassen',[{k:'wg',l:'WG',t:'sel',o:D.wgs.map(w=>w.id)},{k:'text',l:'Beschreibung',t:'ta',req:1},{k:'photo',l:'Foto',t:'photo',cam:1}],'Speichern',o=>{D.schaden.unshift({id:uid(),wg:o.wg,text:o.text.trim(),am:TODAY,status:'offen',photo:o.photo||null});closeM();toast('Schaden erfasst.')});
OBV.profile=()=>pt('Profil')+card('Angemeldet als',`<select data-c="obwho">${sopt(D.obs,D.obName)}</select>`)+card('Zuständigkeit',row('Name','Herr/Frau '+D.obName)+row('Anlagen',obAnls().join(', ')||'–')+row('Vertretung',D.anl.filter(a=>a.vertr===D.obName).map(a=>a.id).join(', ')||'–'))+card('Vertretung übernehmen',`<label class="chk"><input type="checkbox" ${S.sel.obVertr?'checked':''} data-c="obvertr"> <span>Ich vertrete gerade eine Kollegin oder einen Kollegen</span></label><p class="xs mut">Dann siehst du auch deren Anlage.</p>`)+card('Gerät',`<label class="chk"><input type="checkbox" ${S.offline?'checked':''} data-c="oboffc"> <span>Offline-Modus</span></label><p class="xs mut">Im Offline-Modus führst du Kontrollen ohne Internet durch. Sie werden gesendet, sobald du wieder online bist.</p>`);
A.obvertr=v=>{S.sel.obVertr=v;R()};
A.oboffc=v=>{S.offline=v;R()};
A.obwho=v=>{D.obName=v;S.insp=null;S.sel.obVertr=false;S.sel.obAnl='alle';S.sel.obEt='alle';toast('Angemeldet als '+v+'.');R()};
A.oballe=()=>{const k=kOf(S.insp.k);const b=AREAS.filter(a=>k.areas[a].m.length);AREAS.forEach(a=>{if(!k.areas[a].m.length)k.areas[a].ok=true});toast(b.length?'Alle anderen Bereiche sind in Ordnung. Mit Mängeln: '+b.join(', ')+'.':'Alle Bereiche sind in Ordnung.');R()};


/* Release-Labels werden nach jedem Rendern erneut gesetzt, damit alle Klickwege erhalten bleiben. */
function tagReleases(){
 const root=document.getElementById('app'),role=S.role,pg=S.pg[role];
 const badge=n=>{const x=document.createElement('span');x.className='rel-tag r'+n;x.textContent='Release '+n;x.title=n===1?'Basis: funktionsfähiger Kontrollprozess':'Erweiterung: Seezeit Hub';return x};
 const mark=(el,n)=>{if(!el||el.querySelector(':scope > .rel-tag'))return;el.appendChild(badge(n))};
 const findHeading=(name,n)=>{root.querySelectorAll('.card .ch h3,.card > h3,.mn .pt h1,.st-top h1').forEach(x=>{if(x.textContent.trim().includes(name))mark(x,n)})};
 const main=role==='st'?root.querySelector('.st-body'):root.querySelector('.mn');
 if(!main)return;
 const legend=document.createElement('div');legend.className='rel-head';
 legend.innerHTML='<strong>🧩 Release-Plan für diesen Prototyp</strong><div class="rel-legend"><span class="rel-tag r1">Release 1</span> Basis: Putzplan sowie Kontrolle planen, durchführen, Ergebnis und Nachkontrolle <span class="rel-tag r2">Release 2</span> Erweiterungen und Seezeit Hub</div><div class="rel-desc">Die Zuordnung ist eine geplante Umsetzung in zwei Releases. Alle Funktionen bleiben hier bereits als Demo anklickbar.</div>';
 main.insertBefore(legend,main.firstChild);
 if(role==='st'){
  const section={home:1,ctrl:1,msgs:1,clean:1,waste:1,plan:1,more:2,service:2,contact:2,finance:2,damage:2,movein:2,contract:2,tt:2,mensa:2,map:2,settings:2,conf:2,privacy:1};
  const header=root.querySelector('.st-top h1');if(header&&pg!=='home'&&pg!=='more')mark(header,section[pg]||2);
  root.querySelectorAll('.tile').forEach(el=>{const page=el.dataset.v;mark(el,section[page]||2)});
  root.querySelectorAll('.tabbar button').forEach(el=>{const page=el.dataset.v;mark(el,section[page]||2)});
  if(pg==='home'){findHeading('Nächste Kontrolle',1);findHeading('Diese Woche',2);findHeading('Tipp des Monats',2); const c=root.querySelector('.consequence');if(c)mark(c.querySelector('b'),1)}
  if(pg==='more')root.querySelectorAll('button.row[data-v]').forEach(el=>{const text=el.querySelector('b');if(text)mark(text,section[el.dataset.v]||2)});
  if(pg==='clean'){findHeading('Grundausstattung',1);root.querySelectorAll('.card .ch h3').forEach(x=>{if(!x.querySelector('.rel-tag'))mark(x,1)})}
  if(pg==='service'){root.querySelectorAll('[data-a="see-service"]').forEach(el=>mark(el.querySelector('b'),2))}
  if(pg==='contact')findHeading('Neue Nachricht',2);
  if(pg==='ctrl'){root.querySelectorAll('.tabs button').forEach(el=>mark(el,1))}
 }else if(role==='sb'){
  const section={dash:1,plan:1,ann:1,proto:1,fol:1,inb:1,wgs:1,crit:1,ana:2,set:2};
  root.querySelectorAll('.side button[data-v]').forEach(el=>{const txt=el.querySelector('span');mark(txt,section[el.dataset.v]||1)});
  if(pg==='plan'){
   findHeading('Kontrollen planen',1);findHeading('Neue Kontrolle',1);findHeading('Geplante Kontrollen',1);
   root.querySelectorAll('.cal-scroll').forEach(el=>{const heading=el.parentElement.querySelector('.ch h3');if(heading)mark(heading,2)});
   const heading=Array.from(root.querySelectorAll('h3')).find(x=>x.textContent.includes('Verfügbarkeit der Objektbetreuung'));if(heading)mark(heading,2);
  }else if(pg==='ana'){
   findHeading('Auswertung',2);
   root.querySelectorAll('.tabs button').forEach(el=>mark(el,2));
   root.querySelectorAll('.card .ch h3').forEach(el=>mark(el,2));
  }else if(pg==='dash'){findHeading('Übersicht',1)}
  else {root.querySelectorAll('.mn .pt h1').forEach(el=>mark(el,section[pg]||1))}
 }else if(role==='ob'){
  const section={home:1,list:1,inspect:1,damage:2,profile:1};
  root.querySelectorAll('.side button[data-v]').forEach(el=>mark(el.querySelector('span'),section[el.dataset.v]||1));
  root.querySelectorAll('.mn .pt h1').forEach(el=>mark(el,section[pg]||1));
  if(pg==='home'){const off=Array.from(root.querySelectorAll('button')).find(x=>x.textContent.includes('Offline testen')||x.textContent.includes('Online gehen'));if(off)mark(off,2)}
 }
}

R();</script></body></html>
